[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-async-scraper"
version = "0.1.0"
description = "Асинхронный сборщик закупок и карточек товаров с сохранением в PostgreSQL"
readme = "scraper/README.md"
requires-python = ">=3.9"
dependencies = [
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "playwright>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
luna-scraper = "scraper.cli:main"

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Сохраняем совместимость с Python 3.9; некоторые подсказки UP потребовали бы более нового синтаксиса аннотаций.
select = ["E", "F", "I"]
ignore = ["E501"]
